<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111111;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --border: #1d1d1d;
      --shadow: 0 18px 50px rgba(0,0,0,0.55);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #121212, #050505);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: var(--panel);
      padding: 28px 30px;
      border-radius: 16px;
      width: 380px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      letter-spacing: -0.3px;
    }
    form { display: grid; gap: 14px; }
    label { font-size: 14px; color: var(--muted); }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0c0c0c;
      color: var(--text);
    }
    button {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f5f5f5;
      color: #0b0b0b;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .hint { color: var(--muted); font-size: 14px; margin-top: 12px; }
    .link { color: #ffffff; text-decoration: none; border-bottom: 1px solid #2a2a2a; padding-bottom: 1px; }
    .link:hover { border-color: #ffffff; }
    .errorlist { color: #ffb4a6; margin: 0 0 6px; padding-left: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div>
        {% if form.username.errors %}<div class="errorlist">{{ form.username.errors }}</div>{% endif %}
        <label for="id_username">Логин</label>
        {{ form.username }}
      </div>
      <div>
        {% if form.password.errors %}<div class="errorlist">{{ form.password.errors }}</div>{% endif %}
        <label for="id_password">Пароль</label>
        {{ form.password }}
      </div>
      <button type="submit">Войти</button>
    </form>
    <p class="hint">Нет аккаунта? <a class="link" href="{% url 'analytics:register' %}">Регистрация</a></p>
  </div>
</body>
</html>
